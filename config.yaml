server:
  host: "127.0.0.1"
  ctx_size: 4096
  threads: -1            # -1 = llama.cpp auto-detects
  batch_size: 2048
  ubatch_size: 512
  max_tokens: 2048
  request_timeout_s: 180 # total streaming timeout (seconds); 0 = no timeout
  speculative: false     # FULL tier uses LITE as draft; off by default (5x slower on CPU)
  spec_draft_n_max: 8    # tokens to draft per step
  health_timeout_s: 120  # seconds to wait for server to be ready
  idle_timeout_s: 300    # seconds before lazy-started servers are stopped

bench:
  max_tokens: 256        # token cap used by bench_spec.py and other harnesses

router:
  artifacts_dir: "router/artifacts"

cache:
  enabled: true
  size: 512
  ttl_s: 3600

pii:
  ner_enabled: false

escalation:
  enabled: true
  window: 16
  min_tokens: 8
  h_max: null            # set after offline tuning on val split

controller:
  update_every_requests: 5
  max_tau_step: 0.03
  power_window_s: 120

battery:
  mode: simulated
  capacity_wh: 50
  typical_watts: 8.0

energy:
  backend: auto
  idle_watts: null       # set by calibrate_idle.py

gateway:
  host: "127.0.0.1"
  port: 8000

telemetry:
  db: "data/telemetry.sqlite"
  store_query_text: true

cloud:
  enabled: false
